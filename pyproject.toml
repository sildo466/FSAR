[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fsar"
version = "0.1.0"
description = "FSAR - Fully Self-evolving AI Companion"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.4",
    "mcp>=1.0",
    "websockets>=12.0",
    "fastapi>=0.100",
    "uvicorn>=0.25",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[project.scripts]
fsar = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
