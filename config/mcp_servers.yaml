# MCP server definitions (fallback YAML — env var MCP_SERVERS takes priority).
#
# RECOMMENDED: configure servers via the MCP_SERVERS env var in your .env file.
# Example (in .env):
#   MCP_SERVERS='[
#     {"name":"everything","command":"npx",
#      "args":["-y","@modelcontextprotocol/server-everything"],
#      "risk_level":"LOW","enabled":true},
#     {"name":"filesystem","command":"npx",
#      "args":["-y","@modelcontextprotocol/server-filesystem","C:/Users/TANG"],
#      "risk_level":"MEDIUM","enabled":true}
#   ]'
#
# This YAML file is used only when MCP_SERVERS is unset or empty. It is
# convenient when you want per-line editing, comments, or ${VAR} expansion
# inside env values.
#
# Per-server fields:
#   name        — short identifier (becomes part of the namespaced tool name)
#   transport   — only "stdio" supported for now
#   command     — executable to spawn (full path or on PATH)
#   args        — list of arguments passed to command
#   env         — dict of extra env vars (supports ${VAR} expansion)
#   cwd         — working directory for the subprocess (optional)
#   risk_level  — SAFE / LOW / MEDIUM / HIGH / CRITICAL. Default HIGH.
#   enabled     — true to start on FSAR boot; false to skip.
#
# Why default HIGH? MCP tools can do anything (file ops, network, shell).
# Lower the risk only for servers you trust and understand.

servers:
  # MCP "everything" test server — useful for verifying the integration.
  # npx downloads it on first run (~30s), then cached.
  - name: everything
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-everything"]
    risk_level: LOW
    enabled: false

  # Filesystem server, scoped to your home dir. Edit the path before enabling.
  - name: filesystem
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "C:/Users/TANG"]
    risk_level: MEDIUM
    enabled: false

  # GitHub server — needs GITHUB_TOKEN env var.
  - name: github
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
    risk_level: HIGH
    enabled: false