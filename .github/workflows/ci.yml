name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Offline unit gate: sandbox / security / skills / utils plus the
      # offline server suite (tests/server/conftest.py forces it offline).
      # The full suite, including live MCP / e2e tests, runs locally via
      # `pytest tests/ -q` (see CONTRIBUTING.md).
      - name: Run unit tests
        run: pytest tests/sandbox tests/security tests/skills tests/utils tests/server -q

  frontend-build:
    # Fresh-clone frontend gate: tsc -b + vite build must pass on a clean
    # checkout. Catches untracked-but-imported files (e.g. data/presets JSON
    # swallowed by gitignore) that never surface when building locally.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
